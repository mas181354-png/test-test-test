<html lang="en">
<head>

<style>
/* critical boot styles — full theme loads later in the file */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:#0f2c5f;font-size:13px;min-height:100vh;
  background:linear-gradient(160deg,#dbeffe 0%,#e8f3ff 38%,#f4f9ff 70%,#ffffff 100%);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:14px 18px 60px}
.glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);border-radius:16px;
  box-shadow:0 8px 32px rgba(37,99,235,.13);backdrop-filter:blur(18px)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
.logo .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#0ea5e9);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
nav{display:flex;gap:4px;background:rgba(219,234,254,.6);border-radius:12px;padding:4px}
nav button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;font:600 12.5px 'Inter';color:#0f2c5f}
nav button.on{background:#fff;color:#2563eb}
.spacer{flex:1}
.hbtn{border:1px solid rgba(37,99,235,.25);background:rgba(255,255,255,.72);color:#2563eb;font:600 12px 'Inter';padding:8px 14px;border-radius:10px;cursor:pointer}
.stamp{font-size:10.5px;color:#64748b}
.msel{position:relative}
.msel>button{display:flex;align-items:center;gap:7px;border:1px solid rgba(37,99,235,.25);background:rgba(255,255,255,.72);padding:8px 12px;border-radius:10px;cursor:pointer;font:600 12px 'Inter';color:#0f2c5f}
.msel>button .cnt{background:#2563eb;color:#fff;border-radius:999px;padding:1px 8px;font-size:10.5px}
.msel .pane{display:none}
#load{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:60vh}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #dbeafe;border-top-color:#2563eb;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pasteerr{max-width:640px;background:#fee2e2;border:2px solid #ef4444;color:#7f1d1d;border-radius:14px;padding:18px 22px;font:600 14px 'Inter';line-height:1.5}
</style>
<style id="dynW">.namecol{min-width:300px;max-width:300px}.namecol .campname{max-width:none}</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header class="glass">
    <div class="logo"><div class="dot">◈</div>CAMPAIGN TREE <span class="stamp">v13</span></div>
    <nav id="nav">
      <button data-tab="agg" class="on">Aggregates</button>
      <button data-tab="ports">Portfolios</button>
      <button data-tab="camps">Campaigns</button>
      <button data-tab="plc">Placements</button>
      <button data-tab="tgts">Targets</button>

      <div class="pane glass" id="portPane"></div>
    </div>
    <div class="msel" id="mselCamp">

<script>
/* boot guard: if the file below was pasted incompletely, say so instead of a blank page */
window.__CT_BOOT = 1;
setTimeout(function(){
  if (!window.__CT_EOF) {
    var l = document.getElementById('load');
    if (l) l.innerHTML = '<div class="pasteerr">⚠ <b>Index.html is incomplete.</b><br>'+
      'The file was not pasted fully into Apps Script, so the app cannot start.<br><br>'+
      '1. Open the downloaded <b>Index.html</b> in a text editor (Notepad).<br>'+
      '2. Press <b>Ctrl+A</b> (select all) then <b>Ctrl+C</b>.<br>'+
      '3. In Apps Script open the <b>Index</b> file, press Ctrl+A, then Ctrl+V.<br>'+

  }
}, 2500);

<style>

:root{
  --blue:#2563eb; --sky:#0ea5e9; --ink:#0f2c5f; --mut:#64748b;
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.72);
  --bord:rgba(255,255,255,.75); --shadow:0 8px 32px rgba(37,99,235,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#dbeffe 0%,#e8f3ff 38%,#f4f9ff 70%,#ffffff 100%);
  background-attachment:fixed;min-height:100vh;font-size:13px;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0;pointer-events:none}
.blob.b1{width:480px;height:480px;background:#93c5fd;top:-140px;left:-120px}
.blob.b2{width:420px;height:420px;background:#bae6fd;bottom:-160px;right:-100px}
.blob.b3{width:300px;height:300px;background:#e0e7ff;top:40%;left:55%}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:14px 18px 60px}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--bord);border-radius:16px;box-shadow:var(--shadow)}
.card{padding:16px;overflow-x:auto}
.card h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--blue);margin-bottom:10px}
.note{font-size:11px;color:var(--mut);font-style:italic;margin-top:8px}

/* ---------- header ---------- */
header{position:sticky;top:10px;z-index:50;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;padding:10px 16px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.logo .dot{width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:linear-gradient(135deg,var(--blue),var(--sky));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
nav{display:flex;gap:4px;background:rgba(219,234,254,.6);border-radius:12px;padding:4px}
nav button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;
  font:600 12.5px 'Inter';color:var(--ink)}
nav button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(37,99,235,.18)}
.spacer{flex:1}
.hbtn{border:1px solid rgba(37,99,235,.25);background:var(--glass2);color:var(--blue);
  font:600 12px 'Inter';padding:8px 14px;border-radius:10px;cursor:pointer}
.hbtn:hover{background:#fff}
.stamp{font-size:10.5px;color:var(--mut)}

/* ---------- multiselect dropdown ---------- */
.msel{position:relative}
.msel>button{display:flex;align-items:center;gap:7px;max-width:280px;border:1px solid rgba(37,99,235,.25);
  background:var(--glass2);padding:8px 12px;border-radius:10px;cursor:pointer;font:600 12px 'Inter';color:var(--ink)}
.msel>button .cnt{background:var(--blue);color:#fff;border-radius:999px;padding:1px 8px;font-size:10.5px}
.msel .pane{position:absolute;top:calc(100% + 6px);left:0;min-width:320px;max-width:430px;z-index:60;
  padding:10px;display:none;max-height:380px;overflow:auto}
.msel.open .pane{display:block}
.pane .srch{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #dbeafe;
  background:#fff;font:12px 'Inter';margin-bottom:8px}
.pane label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.pane label:hover{background:rgba(219,234,254,.55)}
.pane input{accent-color:var(--blue);margin-top:2px}
.pane .tools{display:flex;gap:8px;margin-bottom:6px}
.pane .tools button{flex:1;border:0;background:rgba(219,234,254,.7);border-radius:7px;
  padding:5px;font:600 11px 'Inter';color:var(--blue);cursor:pointer}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:12px 14px}
.kpi .l{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.kpi .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.kpi .s{font-size:10.5px;color:var(--sky);font-weight:600}

/* ---------- dashboard grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media(max-width:1100px){.c8,.c6,.c4{grid-column:span 12}}

/* ---------- tables ---------- */
.tblwrap{overflow:auto;border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}
th{position:sticky;top:0;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;
  font:700 10.5px 'Inter';letter-spacing:.05em;padding:8px 9px;text-align:right;cursor:pointer;z-index:5}
th.l{text-align:left}
th .arr{opacity:.85;font-size:9px}
td{padding:6px 9px;border-bottom:1px solid rgba(191,219,254,.45);text-align:right;
  font-variant-numeric:tabular-nums}
td.l{text-align:left}
tbody tr:hover td{background:rgba(219,234,254,.35)}
tbody tr:hover td.fz{background:#dbeafe}
tr.sub:hover td.fz{background:#d6e9fc}
tr.tot td{background:rgba(219,234,254,.6);font-weight:700;border-top:2px solid rgba(37,99,235,.35)}
tr.sub td{background:rgba(240,249,255,.72);color:#1e3a5f;font-size:11.5px}
tr.sub.tot2 td{background:rgba(219,234,254,.85);font-weight:700}
tr.grp td{background:linear-gradient(90deg,rgba(37,99,235,.16),rgba(14,165,233,.10));
  font-weight:800;color:#1e3a8a;border-top:2px solid rgba(37,99,235,.30);font-size:12px}
.exp{cursor:pointer;color:var(--blue);font-weight:800;width:26px;text-align:center;user-select:none}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font:700 10px 'Inter';color:#fff}
.chip.SP{background:#2563eb}.chip.SB{background:#7c3aed}.chip.SBV{background:#db2777}.chip.SD{background:#0d9488}
.st{display:inline-block;padding:1px 7px;border-radius:999px;font:600 10px 'Inter'}
.st.enabled{background:#dcfce7;color:#15803d}.st.paused{background:#fef9c3;color:#a16207}
.st.archived{background:#fee2e2;color:#b91c1c}.st.other{background:#e2e8f0;color:#475569}

/* ---------- portfolio cards ---------- */

.phead .pstat{font:600 11px 'Inter';color:#334155}

/* ---------- filters bar ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;margin-bottom:12px}
.fbar select,.fbar input{border:1px solid #dbeafe;background:#fff;border-radius:8px;

/* ---------- heatmap ---------- */
td.hm{padding:4px 5px;text-align:center;font-size:10.5px;min-width:30px}
.b3{background:#93c47d}.b10{background:#b6d7a8}.b20{background:#ffe599}.b48{background:#f9cb9c}
.b100{background:#e69138;color:#fff}.b305{background:#ea9999}.b306{background:#e06666;color:#fff}

/* ---------- bars & donut ---------- */
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar .lb{width:120px;font-size:11px;font-weight:600;text-align:right;color:#334155}
.bar .tr{flex:1;background:rgba(191,219,254,.4);height:14px;border-radius:7px;overflow:hidden}
.bar .fl{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--blue),var(--sky))}

/* sticky frozen columns */
th.fz,td.fz{position:sticky;z-index:6}
td.fz{background:#f4f9ff}
tr.grp td.fz{background:#dbe9fd}

/* header column menu */
#colmenu{position:fixed;z-index:200;min-width:210px;padding:10px;display:none}
#colmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;

#colmenu .cond select,#colmenu .cond input{border:1px solid #dbeafe;border-radius:7px;

/* segmented toggle + class chips */

#load{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:60vh}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #dbeafe;border-top-color:var(--blue);
  animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

</style>

<script>
/**
 * PPC analysis engine — a 1:1 JavaScript port of the verified COMPAIGN TREE
 * workbook logic (V16). Pure functions, no DOM: runs in the browser (web app)
 * and under Node (ground-truth tests).
 *
 * Input: the payload produced by Code.gs getData() — for each sheet an array
 * of row objects {r: <1-based sheet row>, v: [<cell values>]} covering every
 * non-empty row, plus nothing else. Column positions are resolved from the
 * row-2 headers by NAME, so re-pasted reports survive column reordering.
 */
var Engine = (function () {
  'use strict';

  var M6 = ['impr', 'clicks', 'spend', 'sales', 'orders', 'units'];

  // currency-text cleaner (same as the workbook's VALUE(SUBSTITUTE(...)) chain)
  function num(v) {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return v;
    var s = String(v).replace(/[£$€,\s]/g, '');
    var f = parseFloat(s);
    return isNaN(f) ? 0 : f;
  }
  function str(v) { return (v === null || v === undefined) ? '' : String(v).trim(); }

  function headerMap(rows) {
    var hdr = null;
    for (var i = 0; i < rows.length; i++) if (rows[i].r === 2) { hdr = rows[i].v; break; }
    if (!hdr) return {};
    var map = {};
    for (var c = 0; c < hdr.length; c++) {
      var h = str(hdr[c]);
      if (h && !(h in map)) map[h] = c;
    }
    return map;
  }
  function getter(rows) {
    var map = headerMap(rows);
    return function (rowV, name) {
      var c = map[name];
      return c === undefined ? '' : rowV[c];
    };
  }

  function zeroM() {
    return { impr: 0, clicks: 0, spend: 0, sales: 0, orders: 0, units: 0 };
  }
  function metricsOf(g, v) {
    return {
      impr: num(g(v, 'Impressions')), clicks: num(g(v, 'Clicks')),
      spend: num(g(v, 'Spend')), sales: num(g(v, 'Sales')),
      orders: num(g(v, 'Orders')), units: num(g(v, 'Units'))
    };
  }
  function addM(a, b) { for (var i = 0; i < M6.length; i++) a[M6[i]] += b[M6[i]]; return a; }

  // derived ratios — identical to the sheet formulas (blank when denominator 0)
  function derived(m) {
    return {
      ctr: m.impr ? m.clicks / m.impr : null,
      cvr: m.clicks ? m.orders / m.clicks : null,
      acos: m.sales ? m.spend / m.sales : null,
      cpc: m.clicks ? m.spend / m.clicks : null,
      roas: m.spend ? m.sales / m.spend : null,
      aov: m.orders ? m.sales / m.orders : null,
      cpa: m.orders ? m.spend / m.orders : null
    };
  }
  function shares(m, tot) {
    var out = {};
    var keys = { is: 'impr', cs: 'clicks', ss: 'spend', rs: 'sales', os: 'orders', us: 'units' };
    for (var k in keys) out[k] = tot[keys[k]] ? m[keys[k]] / tot[keys[k]] : null;
    return out;
  }

  // match-type classification (ported from the ST/Targets logic)
  function classifyTarget(match, expr) {
    var mt = str(match).toLowerCase();
    if (mt === 'exact') return 'Exact';
    if (mt === 'phrase') return 'Phrase';
    if (mt === 'broad') return 'Broad';
    if (mt) return str(match);
    var e = str(expr).toLowerCase();
    if (e.indexOf('asin-expanded=') === 0 || e.indexOf('asin-expanded =') === 0) return 'ASIN Expanded';
    if (e.indexOf('asin=') === 0 || e.indexOf('asin =') === 0) return 'ASIN';
    if (e.indexOf('category=') === 0) return 'Category';
    if (e === 'close-match' || e === 'loose-match' || e === 'complements' || e === 'substitutes') return 'Auto';
    if (e) return 'Other';
    return '';
  }

  var SP_PLACES = [
    ['Placement top', 'Top of Search'],
    ['Placement rest of search', 'Rest of Search'],
    ['Placement product page', 'Product Pages'],
    ['Placement Amazon Business', 'Amazon Business']
  ];
  var SB_PLACES = [
    ['Top of search', 'Top of Search'],
    ['Detail page', 'Detail Page'],
    ['Home', 'Home'],
    ['Other', 'Other']
  ];

  // ---------------------------------------------------------------- parse
  function parse(raw) {
    var campaigns = [], targets = [], byKey = {};
    var portSet = {};

    function portOf(v) { return v ? String(v) : '(No Portfolio)'; }
    function addCampaign(c) {
      c.placements = {};        // raw place -> {pct, m}
      c.nkw = 0; c.npt = 0;
      campaigns.push(c);
      byKey[c.key] = c;
      portSet[c.port] = true;
    }

    // ---- SP ----
    var sp = raw['Upload SP'] || [];
    var g = getter(sp);
    var videoCids = {};
    sp.forEach(function (row) {
      if (row.r < 3) return;
      var v = row.v, ent = str(g(v, 'Entity'));
      if (!ent) return;
      var cid = str(g(v, 'Campaign ID')), key = 'SP:' + cid;
      if (ent === 'Campaign') {
        addCampaign({
          key: key, src: 'SP', fmt: 'SP', cid: cid,
          name: str(g(v, 'Campaign name (Informational only)')),
          port: portOf(str(g(v, 'Portfolio name (Informational only)'))),
          state: str(g(v, 'State')).toLowerCase(),
          budget: num(g(v, 'Daily budget')),
          ttype: str(g(v, 'Targeting type')),
          bidstrat: str(g(v, 'Bidding strategy')),
          m: metricsOf(g, v)
        });
      } else if (ent === 'Bidding adjustment') {
        var c = byKey[key];
        if (!c) return;
        var pl = str(g(v, 'Placement'));
        if (!c.placements[pl]) c.placements[pl] = { pct: 0, m: zeroM() };
        c.placements[pl].pct += num(g(v, 'Percentage'));
        addM(c.placements[pl].m, metricsOf(g, v));
      } else if (ent === 'Keyword' || ent === 'Product targeting') {
        var cc = byKey[key];
        if (cc) { if (ent === 'Keyword') cc.nkw++; else cc.npt++; }
        var kw = str(g(v, 'Keyword text'));
        var expr = str(g(v, 'Product targeting expression'));
        targets.push({
          src: 'SP', key: key, cid: cid,
          camp: cc ? cc.name : '', port: cc ? cc.port : '(No Portfolio)',
          adgroup: str(g(v, 'Ad group name (Informational only)')),
          target: kw || expr,
          match: classifyTarget(g(v, 'Match type'), expr),
          bid: num(g(v, 'Bid')),
          states: {
            c: str(g(v, 'Campaign state (Informational only)')) || (cc ? cc.state : ''),
            g: str(g(v, 'Ad Group State (Informational only)')),
            t: str(g(v, 'State'))
          },
          m: metricsOf(g, v)
        });
      }
    });

    // ---- SB ----
    var sb = raw['Upload SB'] || [];
    g = getter(sb);
    sb.forEach(function (row) {
      if (row.r < 3) return;
      var v = row.v, ent = str(g(v, 'Entity'));
      if (!ent) return;
      var cid = str(g(v, 'Campaign ID')), key = 'SB:' + cid;
      if (ent === 'Campaign') {
        addCampaign({
          key: key, src: 'SB', fmt: 'SB', cid: cid,
          name: str(g(v, 'Campaign name (Informational only)')),
          port: portOf(str(g(v, 'Portfolio name (Informational only)'))),
          state: str(g(v, 'State')).toLowerCase(),
          budget: num(g(v, 'Budget')),
          ttype: '', bidstrat: str(g(v, 'Bid optimisation')),
          m: metricsOf(g, v)
        });
      } else if (ent === 'Video ad') {
        videoCids[key] = true;
      } else if (ent === 'Bidding adjustment by placement') {
        var c = byKey[key];
        if (!c) return;
        var pl = str(g(v, 'Placement'));
        if (!c.placements[pl]) c.placements[pl] = { pct: 0, m: zeroM() };
        c.placements[pl].pct += num(g(v, 'Percentage'));
        addM(c.placements[pl].m, metricsOf(g, v));
      } else if (ent === 'Keyword' || ent === 'Product targeting') {
        var cc = byKey[key];
        var kw = str(g(v, 'Keyword text'));
        var expr = str(g(v, 'Product targeting expression'));
        targets.push({
          src: 'SB', key: key, cid: cid,
          camp: cc ? cc.name : '', port: cc ? cc.port : '(No Portfolio)',
          adgroup: str(g(v, 'Ad group name (Informational only)')),
          target: kw || expr,
          match: classifyTarget(g(v, 'Match type'), expr),
          bid: num(g(v, 'Bid')),
          states: {
            c: str(g(v, 'Campaign state (Informational only)')) || (cc ? cc.state : ''),
            g: str(g(v, 'Ad group serving status (Informational only)')),
            t: str(g(v, 'State'))
          },
          m: metricsOf(g, v)
        });
      }
    });
    campaigns.forEach(function (c) {
      if (c.src === 'SB' && videoCids[c.key]) c.fmt = 'SBV';
    });

    // ---- SD ----
    var sd = raw['Upload SD'] || [];
    g = getter(sd);
    sd.forEach(function (row) {
      if (row.r < 3) return;
      var v = row.v, ent = str(g(v, 'Entity'));
      if (!ent) return;
      var cid = str(g(v, 'Campaign ID')), key = 'SD:' + cid;
      if (ent === 'Campaign') {
        addCampaign({
          key: key, src: 'SD', fmt: 'SD', cid: cid,
          name: str(g(v, 'Campaign name (Informational only)')),
          port: portOf(str(g(v, 'Portfolio name (Informational only)'))),
          state: str(g(v, 'State')).toLowerCase(),
          budget: num(g(v, 'Budget')),
          ttype: str(g(v, 'Tactic')), bidstrat: str(g(v, 'Bid optimisation')),
          m: metricsOf(g, v)
        });
      } else if (ent === 'Audience targeting' || ent === 'Contextual targeting'
                 || ent === 'Product targeting') {
        var cc = byKey[key];
        var expr = str(g(v, 'Targeting expression')) ||
                   str(g(v, 'Product targeting expression'));
        var label = ent === 'Audience targeting' ? 'Audience' :
                    ent === 'Contextual targeting' ? 'Contextual' :
                    classifyTarget('', expr) || 'Product';
        targets.push({
          src: 'SD', key: key, cid: cid,
          camp: cc ? cc.name : '', port: cc ? cc.port : '(No Portfolio)',
          adgroup: str(g(v, 'Ad group name (Informational only)')),
          target: expr || ent,
          match: label,
          bid: num(g(v, 'Bid')),
          states: {
            c: str(g(v, 'Campaign state (Informational only)')) || (cc ? cc.state : ''),
            g: str(g(v, 'Ad Group State (Informational only)')),
            t: str(g(v, 'State'))
          },
          m: metricsOf(g, v)
        });
      }
    });

    // SP campaign structure (SKC/MKC/SAC/MAC/Mixed)
    campaigns.forEach(function (c) {
      if (c.src !== 'SP') { c.structure = ''; return; }
      if (c.nkw > 0 && c.npt > 0) c.structure = 'Mixed';
      else if (c.nkw > 0) c.structure = c.nkw === 1 ? 'SKC' : 'MKC';
      else if (c.npt > 0) c.structure = c.npt === 1 ? 'SAC' : 'MAC';
      else c.structure = '—';
    });

    // ---- KW TRACKED ----
    var kwRaw = raw['KW TRACKED'] || [];
    var kw = { days: [], map: {} };
    var row3 = null;
    kwRaw.forEach(function (r) { if (r.r === 3) row3 = r.v; });
    if (row3) {
      for (var c = row3.length - 1; c >= 3; c--) {   // last day column .. D, newest first
        var d = row3[c];
        if (d !== null && d !== undefined && d !== '') kw.days.push({ col: c, date: String(d) });
      }
    }
    kwRaw.forEach(function (r) {
      if (r.r < 5) return;
      var k = str(r.v[0]);
      if (!k || k === ' ') return;
      var lk = k.toLowerCase().replace(/\s+/g, ' ');
      if (kw.map[lk]) return;                    // first match wins
      kw.map[lk] = { kw: k, sv: r.v[1], sales: r.v[2], ranks: r.v.slice(3) };
    });

    var portfolios = Object.keys(portSet).sort();
    return { campaigns: campaigns, targets: targets, kw: kw, portfolios: portfolios };
  }

  // ---------------------------------------------------------------- scope
  // selPorts: [] or null = all portfolios; selKeys: [] or null = all campaigns
  function scope(model, selPorts, selKeys) {
    var pset = selPorts && selPorts.length ? toSet(selPorts) : null;
    var kset = selKeys && selKeys.length ? toSet(selKeys) : null;
    function inScope(c) {
      if (pset && !pset[c.port]) return false;
      if (kset && !kset[c.key]) return false;
      return true;
    }
    var camps = model.campaigns.filter(inScope);
    var ckeys = toSet(camps.map(function (c) { return c.key; }));
    var tgts = model.targets.filter(function (t) { return ckeys[t.key]; });
    return { campaigns: camps, targets: tgts, keys: ckeys };
  }
  function toSet(arr) { var s = {}; arr.forEach(function (x) { s[x] = true; }); return s; }

  function totalM(items) {
    var t = zeroM();
    items.forEach(function (x) { addM(t, x.m); });
    return t;
  }

  // ------------------------------------------------------- table builders
  // Campaigns table rows (spend-desc), each with derived + shares vs scope
  function campaignRows(sc) {
    var tot = totalM(sc.campaigns);
    var rows = sc.campaigns.slice().sort(function (a, b) { return b.m.spend - a.m.spend; })
      .map(function (c) {
        var placeOrder = c.src === 'SP' ? SP_PLACES : c.src === 'SB' ? SB_PLACES : [];
        var places = placeOrder.map(function (p) {
          var got = c.placements[p[0]] || { pct: 0, m: zeroM() };
          return { raw: p[0], label: p[1], pct: got.pct, m: got.m, d: derived(got.m) };
        });
        var pTot = zeroM();
        places.forEach(function (p) {
          // Amazon Business is a B2B subset of the other SP placements —
          // keep it OUT of the share denominator
          if (c.src === 'SP' && p.raw === 'Placement Amazon Business') return;
          addM(pTot, p.m);
        });
        places.forEach(function (p) {
          // the Amazon Business row shows NO shares at all — its traffic is
          // already counted inside the other three placements
          if (c.src === 'SP' && p.raw === 'Placement Amazon Business') {
            p.sh = { is: null, cs: null, ss: null, rs: null, os: null, us: null };
          } else {
            p.sh = shares(p.m, pTot);
          }
        });
        return {
          key: c.key, src: c.src, fmt: c.fmt, name: c.name, port: c.port,
          state: c.state, budget: c.budget, ttype: c.ttype, bidstrat: c.bidstrat,
          structure: c.structure,
          m: c.m, d: derived(c.m), sh: shares(c.m, tot),
          places: places
        };
      });
    return { rows: rows, total: tot, totalD: derived(tot) };
  }

  // Portfolios table rows — one row per portfolio in scope, full metrics +
  // shares vs the scope total, spend-desc
  function portfolioRows(sc) {
    var tot = totalM(sc.campaigns);
    var by = {};
    sc.campaigns.forEach(function (c) {
      if (!by[c.port]) by[c.port] = { port: c.port, n: 0, m: zeroM(),
                                      srcs: {}, states: {} };
      var p = by[c.port];
      p.n++; addM(p.m, c.m);
      p.srcs[c.fmt] = (p.srcs[c.fmt] || 0) + 1;
      p.states[c.state] = (p.states[c.state] || 0) + 1;
    });
    var rows = Object.keys(by).map(function (k) {
      var p = by[k];
      p.d = derived(p.m); p.sh = shares(p.m, tot);
      return p;
    }).sort(function (a, b) { return b.m.spend - a.m.spend; });
    return { rows: rows, total: tot, totalD: derived(tot) };
  }

  // Targets table rows (spend-desc, stable by source order like the sheet)
  function targetRows(sc, kwModel) {
    var tot = totalM(sc.targets);
    var idx = 0;
    var arr = sc.targets.map(function (t) { return { t: t, i: idx++ }; });
    arr.sort(function (a, b) {
      return (b.t.m.spend - a.t.m.spend) || (a.i - b.i);
    });
    var rows = arr.map(function (x) {
      var t = x.t;
      var hm = null, sv = null, ksales = null, avg7 = null;
      if (kwModel && t.target) {
        var rec = kwModel.map[String(t.target).trim().toLowerCase().replace(/\s+/g, ' ')];
        if (rec) {
          sv = num(rec.sv); ksales = num(rec.sales);
          var vals = [];
          for (var i = 0; i < Math.min(7, kwModel.days.length); i++) {
            var rv = rec.ranks[kwModel.days[i].col - 3];
            if (rv === null || rv === undefined || rv === '') continue;
            var s = String(rv);
            vals.push(s.indexOf('>') === 0 ? 306 : num(rv));
          }
          if (vals.length) {
            var sum = 0; vals.forEach(function (v) { sum += v; });
            avg7 = sum / vals.length;
          }
        }
        hm = rec ? { sv: rec.sv, sales: rec.sales, ranks: kwModel.days.map(function (d) {
          var v = rec.ranks[d.col - 3];
          return (v === null || v === undefined) ? '' : v;
        }) } : 'NF';
      }
      return {
        src: t.src, camp: t.camp, port: t.port, adgroup: t.adgroup,
        target: t.target, match: t.match, bid: t.bid,
        stateLine: 'Campaign: ' + (t.states.c || '?') +
                   ' | Ad group: ' + (t.states.g || '?') +
                   ' | Target: ' + (t.states.t || '?'),
        states: t.states,
        sv: sv, ksales: ksales, avg7: avg7,
        m: t.m, d: derived(t.m), sh: shares(t.m, tot), hm: hm
      };
    });
    return { rows: rows, total: tot, totalD: derived(tot) };
  }

  // heat bucket for a rank cell — the V10 color buckets
  function heatBucket(v) {
    if (v === '' || v === null || v === undefined) return '';
    if (v === 'NF') return 'nf';
    var s = String(v);
    if (s.indexOf('>') === 0) return 'b306';
    var n = num(v);
    if (!n) return '';
    if (n <= 3) return 'b3';
    if (n <= 10) return 'b10';
    if (n <= 20) return 'b20';
    if (n <= 48) return 'b48';
    if (n <= 100) return 'b100';
    if (n <= 305) return 'b305';
    return 'b306';
  }

  // ------------------------------------------------------------ aggregates
  function seg(items, pred) {
    var grp = items.filter(pred);
    var m = totalM(grp);
    return { n: grp.length, m: m, d: derived(m) };
  }
  function aggregates(sc) {
    var camps = sc.campaigns, tgts = sc.targets;
    var out = {};
    out.total = seg(camps, function () { return true; });
    out.adTypes = [
      ['Sponsored Products (SP)', seg(camps, function (c) { return c.src === 'SP'; })],
      ['Sponsored Brands (SB)', seg(camps, function (c) { return c.fmt === 'SB' && c.src === 'SB'; })],
      ['Sponsored Brands Video (SBV)', seg(camps, function (c) { return c.fmt === 'SBV'; })],
      ['Sponsored Display (SD)', seg(camps, function (c) { return c.src === 'SD'; })]
    ];
    function states(pred) {
      return ['enabled', 'paused', 'archived'].map(function (st) {
        return [st.charAt(0).toUpperCase() + st.slice(1),
                seg(camps, function (c) { return pred(c) && c.state === st; })];
      });
    }
    out.stateAll = states(function () { return true; });
    out.stateSP = states(function (c) { return c.src === 'SP'; });
    out.stateSB = states(function (c) { return c.src === 'SB'; });
    out.stateSD = states(function (c) { return c.src === 'SD'; });

    // per-portfolio (within scope)
    var ports = {};
    camps.forEach(function (c) { ports[c.port] = true; });
    out.portfolios = Object.keys(ports).sort().map(function (p) {
      return [p, seg(camps, function (c) { return c.port === p; })];
    });

    // SP placements (placement-row attribution, Amazon Business = B2B subset)
    function placeSeg(src, raw) {
      var n = 0, m = zeroM();
      camps.forEach(function (c) {
        if (c.src !== src) return;
        var p = c.placements[raw];
        if (p) { n++; addM(m, p.m); }
      });
      return { n: n, m: m, d: derived(m) };
    }
    out.spPlacements = SP_PLACES.map(function (p) { return [p[1], placeSeg('SP', p[0])]; });
    out.sbPlacements = SB_PLACES.map(function (p) { return [p[1], placeSeg('SB', p[0])]; });

    // SP match/target types — target-level attribution (like the sheet)
    var spT = tgts.filter(function (t) { return t.src === 'SP'; });
    var MT = ['Exact', 'Phrase', 'Broad', 'ASIN', 'ASIN Expanded', 'Category', 'Auto', 'Other'];
    out.spMatchTypes = MT.map(function (mt) {
      return [mt, seg(spT, function (t) { return t.match === mt; })];
    });

    // SP bidding strategies / targeting type / structure — campaign level
    var spC = camps.filter(function (c) { return c.src === 'SP'; });
    var strat = {};
    spC.forEach(function (c) { strat[c.bidstrat || '—'] = true; });
    out.spBidding = Object.keys(strat).sort().map(function (s) {
      return [s, seg(spC, function (c) { return (c.bidstrat || '—') === s; })];
    });
    out.spTargeting = ['Manual', 'Auto'].map(function (tt) {
      return [tt, seg(spC, function (c) { return str(c.ttype).toLowerCase() === tt.toLowerCase(); })];
    });
    out.spStructure = ['SKC', 'MKC', 'SAC', 'MAC', 'Mixed'].map(function (s) {
      return [s, seg(spC, function (c) { return c.structure === s; })];
    });

    // SB ad format
    out.sbFormats = [
      ['Product Collection / Other', seg(camps, function (c) { return c.src === 'SB' && c.fmt === 'SB'; })],
      ['Video', seg(camps, function (c) { return c.fmt === 'SBV'; })]
    ];

    // SB target match types (target-level)
    var sbT = tgts.filter(function (t) { return t.src === 'SB'; });
    out.sbMatchTypes = MT.map(function (mt) {
      return [mt, seg(sbT, function (t) { return t.match === mt; })];
    }).filter(function (x) { return x[1].n > 0; });

    // SD targeting (target-level) — every label present in the data
    var sdT = tgts.filter(function (t) { return t.src === 'SD'; });
    var sdLabs = {};
    sdT.forEach(function (t) { sdLabs[t.match || 'Other'] = true; });
    out.sdTargeting = Object.keys(sdLabs).sort().map(function (lab) {
      return [lab, seg(sdT, function (t) { return (t.match || 'Other') === lab; })];
    });

    // Targets match-type mix across all ad types (bonus card)
    out.targetMatchAll = MT.concat(['Audience', 'Contextual']).map(function (mt) {
      return [mt, seg(tgts, function (t) { return t.match === mt; })];
    }).filter(function (x) { return x[1].n > 0; });

    return out;
  }

  return {
    num: num, parse: parse, scope: scope,
    campaignRows: campaignRows, targetRows: targetRows, portfolioRows: portfolioRows,
    aggregates: aggregates, heatBucket: heatBucket,
    derived: derived, shares: shares, totalM: totalM, M6: M6
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = Engine;

</script>
<script>
(function(){
'use strict';
var S = {
  raw:null, model:null, tab:'agg',
  selPorts:[], selKeys:[],
  cf:[], tf:[], csearch:'', tsearch:'', cview:'port', tclass:'all', goals:null,
  pf:[], psearch:'', psort:{k:'spend',dir:-1}, ptype:'all', pclosed:{}, nameW:300,
  csort:{k:'spend',dir:-1}, tsort:{k:'spend',dir:-1},
  heat:false
};
try{
  var saved = JSON.parse(localStorage.getItem('ppcApp')||'{}');
  ['tab','selPorts','selKeys','heat','cview','tclass','nameW'].forEach(function(k){ if(saved[k]!==undefined) S[k]=saved[k]; });
  if(['agg','ports','camps','plc','tgts','spa','sba','sda'].indexOf(S.tab)<0) S.tab='agg';
}catch(e){}
function persist(){
  try{ localStorage.setItem('ppcApp', JSON.stringify(
    {tab:S.tab, selPorts:S.selPorts, selKeys:S.selKeys, heat:S.heat, cview:S.cview, tclass:S.tclass, nameW:S.nameW})); }catch(e){}
}

/* ---------------- formatting ---------------- */
function fi(v){ return (v===null||v===undefined)?'':Math.round(v).toLocaleString('en-GB'); }
function fc(v){ return (v===null||v===undefined)?'':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fp(v){ return (v===null||v===undefined)?'':(v*100).toFixed(1)+'%'; }
function fx(v){ return (v===null||v===undefined)?'':v.toFixed(2)+'×'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stChip(s){
  var k = (s||'').toLowerCase();
  var cls = (k==='enabled'||k==='paused'||k==='archived')?k:'other';
  return '<span class="st '+cls+'">'+esc(s||'—')+'</span>';
}

/* ---------------- data load ---------------- */
var GOAL_DEFAULTS = {start:'', end:'', spend:null, orders:null, units:null,
                     acos:null, totUnits:null, totSales:null};
function loadFail(msg, detail){
  clearTimeout(S._wd1); clearTimeout(S._wd2);
  document.getElementById('load').innerHTML =
    '<div class="pasteerr">⚠ <b>Could not load the data.</b><br>'+esc(msg)+
    (detail?'<br><span style="font-weight:400;font-size:12px">'+esc(detail)+'</span>':'')+
    '<br><br><button class="hbtn" onclick="location.reload()">⟳ Try again</button></div>';
}
function onData(json){
 try {
  clearTimeout(S._wd1); clearTimeout(S._wd2);
  var payload = (typeof json==='string')?JSON.parse(json):json;
  if (payload && payload.error){
    loadFail('The spreadsheet code reported an error:', payload.error); return;
  }
  S.raw = payload.sheets||payload;
  var g = payload.goals;
  if (!g){ try{ g = JSON.parse(localStorage.getItem('ppcGoals')||'null'); }catch(e){} }
  S.goals = g || JSON.parse(JSON.stringify(GOAL_DEFAULTS));
  S.model = Engine.parse(S.raw);
  // drop stale selections
  S.selPorts = S.selPorts.filter(function(p){ return S.model.portfolios.indexOf(p)>=0; });
  var keys = {}; S.model.campaigns.forEach(function(c){ keys[c.key]=true; });
  S.selKeys = S.selKeys.filter(function(k){ return keys[k]; });
  S.warnings = payload.warnings || [];
  document.getElementById('load').style.display='none';
  document.getElementById('view').style.display='';
  document.getElementById('stamp').textContent =
    'Data loaded ' + new Date().toLocaleTimeString() +
    (payload.tookMs ? ' · server ' + payload.tookMs + 'ms' : '');
  applyNameW();
  renderControls(); render();
 } catch(e){
  loadFail('The app hit an error while reading the data — send this to have it fixed:',
           (e && e.message) + ' | ' + String(e && e.stack).slice(0, 300));
 }
}
function load(){
  document.getElementById('load').style.display='';
  document.getElementById('view').style.display='none';
  var WD1 = window.__WD_FAST ? 1500 : 20000, WD2 = window.__WD_FAST ? 3000 : 45000;
  clearTimeout(S._wd1); clearTimeout(S._wd2);
  S._wd1 = setTimeout(function(){
    var l = document.getElementById('load');
    if (!l || l.style.display==='none') return;
    var d = l.querySelector('div:last-child');
    if (d) d.textContent = 'Still waiting for Google Apps Script… (this normally takes 2–5 seconds)';
    if (window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(function(){
        var d2 = document.querySelector('#load div:last-child');
        if (d2) d2.textContent = 'Google is reachable — the data call is still running…';
      }).ping();
    }
  }, WD1);
  S._wd2 = setTimeout(function(){

function valOf(row,k){
  if (k==='budget'||k==='bid') return row[k];
  if (row.m && k in row.m) return row.m[k];
  if (row.d && k in row.d) return row.d[k];
  if (row.sh && k in row.sh) return row.sh[k];
  var v = row[k];
  if (typeof v==='string' || typeof v==='number') return v;
  return null;
}
function applyFilters(rows, filters, search, textOf){
  return rows.filter(function(r){
    if (search){
      if (textOf(r).toLowerCase().indexOf(search.toLowerCase())<0) return false;
    }
    for (var i=0;i<filters.length;i++){
      var f=filters[i], v=valOf(r,f.k);
      if (v===null||v===undefined) v=0;
      if (f.op==='>' && !(v> f.v)) return false;
      if (f.op==='<' && !(v< f.v)) return false;
      if (f.op==='=' && !(Math.abs(v-f.v)<1e-9)) return false;
      if (f.op==='≥' && !(v>=f.v)) return false;
      if (f.op==='≤' && !(v<=f.v)) return false;
      if (f.op==='≠' && !(Math.abs(v-f.v)>=1e-9)) return false;
    }
    return true;
  });
}
function sortRows(rows, sort){
  var k=sort.k, d=sort.dir;
  return rows.slice().sort(function(a,b){
    var x=valOf(a,k), y=valOf(b,k);
    if (typeof x==='string'||typeof y==='string')
      return d*String(x||'').localeCompare(String(y||''));
    return d*(((x==null)?-Infinity:x) - ((y==null)?-Infinity:y));
  });
}

var DONUT_COLORS={'SP':'#2563eb','SB':'#7c3aed','SBV':'#db2777','SD':'#0d9488'};

/* ================= PORTFOLIOS ================= */
function gnum(x){ var f = parseFloat(x); return isNaN(f)?null:f; }
function goalsCalc(sc){
  var g = S.goals || {};
  var t = Engine.totalM(sc.campaigns);
  var d = Engine.derived(t);
  var out = {t:t, d:d};
  out.spend=gnum(g.spend); out.orders=gnum(g.orders); out.units=gnum(g.units);
  out.acos=gnum(g.acos); if (out.acos!==null && out.acos>1) out.acos=out.acos/100;
  out.totU=gnum(g.totUnits); out.totS=gnum(g.totSales);
  var sd = g.start? new Date(g.start):null, ed = g.end? new Date(g.end):null;
  out.days = (sd&&ed&&!isNaN(sd)&&!isNaN(ed)) ? Math.round((ed-sd)/86400000)+1 : null;
  if (sd && !isNaN(sd) && out.days){
    var el = Math.floor((new Date() - sd)/86400000)+1;
    out.elapsed = Math.max(0, Math.min(out.days, el));
  }
  out.spSpace = out.spend!==null? out.spend - t.spend : null;      // budget left (green when >=0)
  // orders/units: actual - goal, so a shortfall shows as NEGATIVE and red
  out.orSpace = out.orders!==null? t.orders - out.orders : null;
  out.unSpace = out.units!==null? t.units - out.units : null;
  out.acSpace = (out.acos!==null && d.acos!==null)? out.acos - d.acos : null; // = Q11-Q9
  out.profit = (out.acSpace!==null)? out.acSpace * t.sales : null; // = Q12 × sales
  return out;
}
function gcell(v, fmt, signed){
  if (v===null||v===undefined||v==='') return '<td>—</td>';
  var cls = signed? (v>=0?'pos':'neg') : '';
  return '<td class="'+cls+'">'+fmt(v)+'</td>';
}

function wireGoals(v){
  v.querySelectorAll('input[data-g]').forEach(function(inp){
    inp.onchange=function(){
      var k=this.getAttribute('data-g');
      var val=this.value===''?null:this.value;
      if (k==='acos' && val!==null){ var f=parseFloat(val); if(!isNaN(f)&&f>1) val=f/100; }
      if (['spend','orders','units','totUnits','totSales'].indexOf(k)>=0 && val!==null){
        var f2=parseFloat(val); val=isNaN(f2)?null:f2;
      }
      S.goals[k]=val; render();
    };
  });
  function save(){
    try{ localStorage.setItem('ppcGoals', JSON.stringify(S.goals)); }catch(e){}
    if (window.google && google.script && google.script.run){
      google.script.run.withSuccessHandler(function(){
        document.getElementById('stamp').textContent='Goals saved '+new Date().toLocaleTimeString();
      }).saveGoals(S.goals);
    }
  }
  var b1=document.getElementById('gsave'), b2=document.getElementById('gsave2');
  if(b1) b1.onclick=save; if(b2) b2.onclick=save;
}

/* ================= TARGETS ================= */
var TCOLS=[['target','Target',null,'l'],['match','Match',null,'l'],['bid','Bid',fc,'m'],
  ['sv','SV',fi,'m'],['ksales','KW Sales',fi,'m'],['avg7','7d Rank',null,'m']]
  .concat(MCOLS).concat(SHCOLS.map(function(s){return [s[0],s[1],fp,'sh'];}));
var TFCOLS=[['bid','Bid'],['sv','SV'],['ksales','KW Sales'],['avg7','7d Rank']].concat(MCOLS.map(function(c){return [c[0],c[1]];})).concat(SHCOLS);
function renderTgts(sc){
  var tr = Engine.targetRows(sc, S.model.kw);
  var KWM = {Exact:1, Phrase:1, Broad:1};
  var rows = tr.rows.filter(function(r){
    if (S.tclass==='kw') return KWM[r.match];
    if (S.tclass==='pt') return !KWM[r.match];
    return true;
  });
  rows = applyFilters(rows, S.tf, S.tsearch,
    function(r){ return r.target+' '+r.camp+' '+r.match; });
  rows = sortRows(rows, S.tsort);
  var CAP = 1000, totalRows = rows.length, capped = totalRows > CAP;
  if (capped) rows = rows.slice(0, CAP);
  var days = S.model.kw.days;
  var FZ = {target:'fz namecol', target_st:'left:62px'};
  var h = fbarHTML('tfbar', TFCOLS, S.tf, S.tsearch, true);
  h = h.replace('<input class="txt"',
    '<div class="seg" id="tclassSeg">'+
    '<button data-v="all" class="'+(S.tclass==='all'?'on':'')+'">All</button>'+
    '<button data-v="kw" class="'+(S.tclass==='kw'?'on':'')+'">Keywords</button>'+
    '<button data-v="pt" class="'+(S.tclass==='pt'?'on':'')+'">ASIN / PT</button></div>'+
    '<input class="txt"');
  if (S.heat){
    var nHit = rows.filter(function(r){ return r.hm && r.hm!=='NF'; }).length;
    if (!nHit){
      var samples = Object.keys(S.model.kw.map).slice(0,3).map(function(k){
        return '“'+S.model.kw.map[k].kw+'”'; }).join(', ');
      h += '<div class="banner">⚠ None of the current targets were found in KW TRACKED, so every rank shows NF. '+
        (samples? 'KW TRACKED currently tracks keywords like '+esc(samples)+' — paste THIS product’s tracked keywords into the KW TRACKED tab (keywords in column A from row 5, dates in row 3) and hit Refresh.'
                : 'The KW TRACKED tab is empty — paste your rank-tracking data there (keywords in column A from row 5, dates in row 3) and hit Refresh.')+'</div>';
    }
  }
  if (capped){
    h += '<div class="banner">Showing the top '+CAP+' of '+totalRows.toLocaleString()+' targets by the current sort — use search, the class chips or column filters to narrow. Totals cover ALL targets in scope.</div>';
  }
  var hmHead='';
  if (S.heat){
    hmHead=days.map(function(d){
      var m=String(d.date).match(/^(\d{4})-(\d{2})-(\d{2})/);
      var dt=m? new Date(+m[1], +m[2]-1, +m[3]) : new Date(d.date);
      var lab=isNaN(dt)?esc(String(d.date).slice(0,6)):(dt.getDate()+' '+dt.toLocaleString('en',{month:'short'}));
      return '<th class="hmh">'+lab+'</th>';
    }).join('');
  }
  h+='<div class="tblwrap glass"><table><thead><tr><th class="l fz" style="left:0;width:62px">Type</th>'+
     thRow(TCOLS,S.tsort,hmHead,FZ)+'</tr></thead><tbody>';
  var t=tr.total, td=tr.totalD;
  h+='<tr class="tot"><td class="l fz" style="left:0">'+(capped? rows.length+' of '+totalRows : rows.length)+' targets</td>'+
     '<td class="l fz namecol" style="left:62px">TOTAL — scope</td><td></td><td></td><td></td><td></td><td></td>'+
     '<td>'+fi(t.impr)+'</td><td>'+fi(t.clicks)+'</td><td>'+fp(td.ctr)+'</td><td>'+fc(t.spend)+'</td><td>'+fc(t.sales)+
     '</td><td>'+fi(t.orders)+'</td><td>'+fi(t.units)+'</td><td>'+fp(td.cvr)+'</td><td>'+fp(td.acos)+'</td><td>'+fc(td.cpc)+
     '</td><td>'+fx(td.roas)+'</td><td>'+fc(td.aov)+'</td><td colspan="'+(6+(S.heat?days.length:0))+'"></td></tr>';
  rows.forEach(function(r){
    h+='<tr><td class="l fz" style="left:0"><span class="chip '+r.src+'">'+r.src+'</span></td>'+
       '<td class="l fz namecol" style="left:62px" title="'+esc(r.stateLine)+'"><span class="campname">'+esc(r.target)+'</span>'+
       '<span class="dim campname">'+esc(r.camp)+'</span></td>'+
       '<td class="l"><span class="mchip'+((r.match==='Exact'||r.match==='Phrase'||r.match==='Broad')?'':' pt')+'">'+esc(r.match)+'</span>'+
       ((r.states.t||'').toLowerCase()==='enabled'?'':' '+stChip(r.states.t))+'</td><td>'+fc(r.bid||null)+'</td>'+
       '<td>'+(r.sv==null?'':fi(r.sv))+'</td><td>'+(r.ksales==null?'':fi(r.ksales))+'</td>'+
       '<td class="hm '+(r.avg7==null?'':Engine.heatBucket(Math.round(r.avg7)))+'">'+(r.avg7==null?'':(Math.round(r.avg7*10)/10).toFixed(1))+'</td>';
    MCOLS.forEach(function(c){ h+='<td>'+c[2](valOf(r,c[0]))+'</td>'; });
    SHCOLS.forEach(function(sx){ h+='<td'+shBg(r.sh[sx[0]])+'>'+fp(r.sh[sx[0]])+'</td>'; });
    if (S.heat){
      if (r.hm && r.hm!=='NF'){
        r.hm.ranks.forEach(function(v){
          h+='<td class="hm '+Engine.heatBucket(v)+'">'+esc(v)+'</td>';
        });
      } else {
        h+=days.map(function(){ return '<td class="hm nf">NF</td>'; }).join('');
      }
    }
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if (S.heat) h+='<div class="note">Rank buckets: 1-3, 4-10, 11-20, 21-48, 49-100, 101-305, &gt;306 · NF = keyword not tracked (ASIN/category targets are always NF). Newest day on the left.</div>';
  return h;
}

/* ---------------- render ---------------- */
function render(){
  if (!S.model) return;
  var sc = curScope();
  var v = document.getElementById('view');
  var warn = (S.warnings && S.warnings.length)
    ? '<div class="banner">⚠ '+S.warnings.map(esc).join('<br>⚠ ')+'</div>' : '';
  if (S.tab==='agg') v.innerHTML = warn + renderAgg(sc);
  else if (S.tab==='ports') v.innerHTML = warn + renderPorts(sc);
  else if (S.tab==='spa') v.innerHTML = warn + renderSPA(sc);
  else if (S.tab==='sba') v.innerHTML = warn + renderSBA(sc);
  else if (S.tab==='sda') v.innerHTML = warn + renderSDA(sc);
  else if (S.tab==='plc') v.innerHTML = warn + renderPlc(sc);
  else if (S.tab==='camps') v.innerHTML = warn + renderCamps(sc);
  else v.innerHTML = warn + renderTgts(sc);

  if (S.tab==='camps'){
    wireFbar('cfbar', S.cf, CFCOLS, render, function(q){S.csearch=q;render();}, null);
    v.querySelectorAll('th[data-k]').forEach(function(th){
      th.onclick=function(e){ e.stopPropagation();
        openColMenu(this, this.getAttribute('data-k'), this.getAttribute('data-l')||this.textContent, 'c'); };
    });
    var seg = document.getElementById('cviewSeg');
    if (seg) seg.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){ S.cview=this.getAttribute('data-v'); persist(); render(); };
    });
  } else if (S.tab==='plc'){
    wireFbar('pfbar', S.pf, CFCOLS, render, function(q){S.psearch=q;render();}, null);
    v.querySelectorAll('.exp').forEach(function(td){
      td.onclick=function(){ var k=this.getAttribute('data-k');
        S.pclosed[k]=!S.pclosed[k]; render(); };
    });
    v.querySelectorAll('th[data-k]').forEach(function(th){
      th.onclick=function(e){ e.stopPropagation();
        openColMenu(this, this.getAttribute('data-k'), this.getAttribute('data-l')||this.textContent, 'p'); };
    });
    var segp = document.getElementById('ptypeSeg');
    if (segp) segp.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){ S.ptype=this.getAttribute('data-v'); render(); };
    });
    var be=document.getElementById('plcExpand'), bc=document.getElementById('plcCollapse');
    if (be) be.onclick=function(){ S.pclosed={}; render(); };
    if (bc) bc.onclick=function(){ S.model.campaigns.forEach(function(c){ S.pclosed[c.key]=true; }); render(); };
  } else if (S.tab==='tgts'){
    wireFbar('tfbar', S.tf, TFCOLS, render, function(q){S.tsearch=q;render();},
      function(on){ S.heat=on; persist(); render(); });
    v.querySelectorAll('th[data-k]').forEach(function(th){
      th.onclick=function(e){ e.stopPropagation();
        openColMenu(this, this.getAttribute('data-k'), this.getAttribute('data-l')||this.textContent, 't'); };
    });
    var seg2 = document.getElementById('tclassSeg');
    if (seg2) seg2.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){ S.tclass=this.getAttribute('data-v'); persist(); render(); };
    });
  } else if (S.tab==='ports'){
    wireGoals(v);
  }
}
load();
})();
</script>
<script>window.__CT_EOF = true;</script>
</body>
</html>
